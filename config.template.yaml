name: Allfold
# Legacy seed used only for this configuration's first validated SQLite migration.
venue_whitelist: list.md
keyword_expression: 'machine AND learn*'
provider_order:
  - pubmed
  - openalex
  - europe_pmc
  - crossref
  - arxiv
  - biorxiv
  - medrxiv
  - wos
# PubMed/OpenAlex keys are optional and saved explicitly outside YAML.
# WoS is opt-in; selected discovery sources run in parallel.
enabled_providers:
  - pubmed
  - openalex
provider_aliases: {}
crossref_mailto: ''
output_dir: workspace
from_month: '2026-01'
to_month: '2026-01'
log_level: INFO
institution:
  name: ''
  idp_entity_id: ''
  use_shibboleth: false
workflow:
  prepare_service_concurrency: 5
  paper_service_concurrency: 2
  paper_global_concurrency: 4
  pdf_concurrency: 2
