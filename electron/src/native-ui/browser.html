<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
<title>Browser — Allfold</title><link rel="stylesheet" href="browser.css"></head>
<body><nav aria-label="标签页"><div id="tabs"></div><button id="new" aria-label="新建标签页">＋</button><div id="maintenance" role="group" aria-label="浏览器维护"><button id="devtools">DevTools</button><button id="cache-size" title="查询当前持久 Session 的 HTTP 缓存大小">HTTP 缓存：未查询</button><button id="clear-cache" title="清理 HTTP、代码及站点缓存，保留 Cookie、Local Storage 和 IndexedDB">清理缓存</button><button id="clear-site-data" title="清除所有站点的数据和登录状态，保留下载文件及下载历史">清除站点数据</button></div></nav>
<form id="address"><button type="button" id="back" aria-label="后退">←</button><button type="button" id="forward" aria-label="前进">→</button><button type="button" id="reload" aria-label="刷新">↻</button><input id="url" aria-label="地址" placeholder="输入 https:// 地址" autocomplete="off" spellcheck="false"><button>前往</button><span id="message" role="status"></span></form>
<script src="browser-chrome.js"></script></body></html>
