name: Safety checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  safety:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Select validation scope
        id: scope
        run: python3 tools/ci_scope.py
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: steps.scope.outputs.full == 'true'
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        if: steps.scope.outputs.full == 'true'
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.19
        if: steps.scope.outputs.full == 'true'
      - run: npm --prefix electron run setup
        if: steps.scope.outputs.full == 'true'
      - run: npm --prefix electron run check
        if: steps.scope.outputs.full == 'true'
      - run: uv run --locked pytest
        if: steps.scope.outputs.full == 'true'
      - run: npm --prefix electron test
        if: steps.scope.outputs.full == 'true'
