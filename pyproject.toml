[project]
name = "allfold"
version = "0.1.0"
description = "A lightweight journal-monitoring workflow"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "anyio>=4.4,<5",
    "fastapi>=0.116,<1",
    "httpx>=0.27,<0.29",
    "pillow>=12.3.0",
    "pydantic>=2,<3",
    "pydoll-python==3.0.0",
    "python-multipart>=0.0.20,<1",
    "PyYAML>=6,<7",
    "uvicorn>=0.30,<1",
    "websockets>=16,<17",
]

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
